<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6f2148" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Countdown" />
  <title>Sonu ❤️ Golu</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <section class="login-card">
      <div class="lock">♥</div>
      <p class="eyebrow">PRIVATE WEDDING COUNTDOWN</p>
      <h2>Sonu & Golu</h2>
      <p class="hint">Enter the family PIN to continue.</p>
      <form id="loginForm">
        <input id="pinInput" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="Enter PIN" aria-label="Enter PIN" required />
        <button type="submit">Open countdown</button>
      </form>
      <p id="loginError" class="error" role="alert"></p>
    </section>
  </div>

  <main id="app" class="page hidden">
    <section class="card">
      <div class="top-row">
        <p class="eyebrow">WE ARE GETTING MARRIED</p>
        <button id="lockBtn" class="lock-btn" type="button">Lock</button>
      </div>
      <h1>Sonu <span>♥</span> Golu</h1>
      <p class="date">29 January 2027</p>
      <div class="countdown" aria-label="Wedding countdown">
        <div class="time-box"><strong id="days">0</strong><small>Days</small></div>
        <div class="time-box"><strong id="hours">00</strong><small>Hours</small></div>
        <div class="time-box"><strong id="minutes">00</strong><small>Minutes</small></div>
        <div class="time-box"><strong id="seconds">00</strong><small>Seconds</small></div>
      </div>
      <div class="milliseconds"><span id="milliseconds">000</span><small>milliseconds</small></div>
      <p id="message" class="message">Every second brings us closer.</p>
      <button id="shareBtn" type="button">Share our countdown</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
