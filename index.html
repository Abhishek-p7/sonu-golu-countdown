<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6f2148" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Countdown" />
  <title>Sonu ❤️ Golu</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">WE ARE GETTING MARRIED</p>
      <h1>Sonu <span>♥</span> Golu</h1>
      <p class="date">29 January 2027</p>

      <div class="countdown" aria-label="Wedding countdown">
        <div class="time-box"><strong id="days">0</strong><small>Days</small></div>
        <div class="time-box"><strong id="hours">0</strong><small>Hours</small></div>
        <div class="time-box"><strong id="minutes">0</strong><small>Minutes</small></div>
        <div class="time-box"><strong id="seconds">0</strong><small>Seconds</small></div>
      </div>

      <div class="milliseconds">
        <span id="milliseconds">000</span>
        <small>milliseconds</small>
      </div>

      <p id="message" class="message">Every second brings us closer.</p>
      <button id="shareBtn" type="button">Share our countdown</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
